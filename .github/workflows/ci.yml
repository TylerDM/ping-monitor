name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A new push to the same branch cancels the in-flight run for the old commit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Windows, because Windows is the only thing this runs on: it is a tray app
  # built on Win32. CI builds the thing that ships.
  #
  # LINUX IS A WORKSTATION, NOT A TARGET. Developing there stays supported, and
  # what supports it is checked into the repo rather than run per-build:
  # .gitattributes and scripts/setup-git.ts for line endings, and the Windows
  # target in rust-toolchain.toml so `cargo check --target
  # x86_64-pc-windows-msvc` works. See "Cross-platform development" in the
  # README.
  #
  # The toolchain comes from rust-toolchain.toml: rustup is preinstalled on the
  # runner and installs the pinned version on the first cargo call.
  # ---------------------------------------------------------------------------
  build:
    name: Build & lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build (release)
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v7
        with:
          name: ping-monitor
          path: target/release/ping-monitor.exe
